<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>غير متصل | تجمع الشرقية الصحي</title>
  <link rel="stylesheet" href="/assets/css/ehc.css">
</head>
<!-- Shown by sw.js when there is no connection. Static on purpose (no server): keep the numbers in step with
     Settings › emergency numbers / unified number. -->
<body class="leading-relaxed">
  <main class="mx-auto grid min-h-screen max-w-[520px] content-center gap-6 px-5 py-10 text-center">
    <img src="/assets/img/logo-ar.png" alt="تجمع الشرقية الصحي" class="mx-auto h-12 w-auto">
    <div>
      <h1 class="text-2xl font-bold text-deep-900">أنت غير متصل بالإنترنت</h1>
      <p class="mt-2 text-slate-600" lang="en" dir="ltr">You're offline</p>
      <p class="mt-3 text-slate-600">في حالة الطوارئ يمكنك الاتصال مباشرة، حتى بدون إنترنت.</p>
    </div>
    <div class="grid gap-3">
      <a href="tel:997" class="rounded-2xl bg-emerg-600 p-4 text-white"><span class="block text-sm">الطوارئ والإسعاف · Emergency</span><b class="text-3xl" dir="ltr">997</b></a>
      <a href="tel:937" class="rounded-2xl bg-brand-50 p-4 text-deep-900"><span class="block text-sm">الاستشارات الطبية · Medical advice 24/7</span><b class="text-3xl" dir="ltr">937</b></a>
      <a href="tel:920022231" class="rounded-2xl bg-brand-50 p-4 text-deep-900"><span class="block text-sm">الرقم الموحد للتجمع · EHC unified number</span><b class="text-2xl" dir="ltr">920022231</b></a>
    </div>
    <a href="/" class="btn btn-primary mx-auto">إعادة المحاولة · Try again</a>
  </main>
</body>
</html>
